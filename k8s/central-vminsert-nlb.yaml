apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics-vminsert-nlb
  namespace: monitoring
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb        # NLB, not the default Classic LB
    service.beta.kubernetes.io/aws-load-balancer-internal: "true" # private subnets only
spec:
  type: LoadBalancer
  selector:                       # copied from work's NLB Service
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/instance: vm-stack-victoria-metrics-k8s-stack
    app.kubernetes.io/name: vminsert
    managed-by: vm-operator
  ports:
    - name: tcp-8480
      port: 8480
      targetPort: 8480
      protocol: TCP
